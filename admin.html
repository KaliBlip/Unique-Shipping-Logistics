<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcel Tracking Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 50px;
        }

        h1 {
            color: #007bff;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .form-group label {
            font-weight: 600;
            color: #495057;
        }

        .form-control {
            border-radius: 5px;
            border: 1px solid #ced4da;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .btn {
            border-radius: 5px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 10px 20px;
            margin: 0 5px;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }

        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .form-row {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center"><i class="fas fa-box-open mr-2"></i>Parcel Tracking Dashboard</h1>
        <form>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="TrackingIdInp"><i class="fas fa-barcode mr-2"></i>Tracking ID</label>
                    <input type="text" class="form-control" id="TrackingIdInp" placeholder="Enter tracking ID">
                </div>
                <div class="form-group col-md-6">
                    <label for="ParcelNameInp"><i class="fas fa-box mr-2"></i>Name of Parcel</label>
                    <input type="text" class="form-control" id="ParcelNameInp" placeholder="Enter parcel name">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="SourceInp"><i class="fas fa-map-marker-alt mr-2"></i>Source</label>
                    <input type="text" class="form-control" id="SourceInp" placeholder="Enter source">
                </div>
                <div class="form-group col-md-6">
                    <label for="DestinationInp"><i class="fas fa-flag-checkered mr-2"></i>Destination</label>
                    <input type="text" class="form-control" id="DestinationInp" placeholder="Enter destination">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="StatusInp"><i class="fas fa-info-circle mr-2"></i>Status</label>
                    <select class="form-control" id="StatusInp">
                        <option value="Source">Pending</option>
                        <option value="Recieved">Recieved</option>
                        <option value="In Transit">In Transit</option>
                        <option value="Delivery">Out for Delivery</option>
                        <option value="Destination">Destination</option>
                    </select>
                </div>
                <div class="form-group col-md-4">
                    <label for="DispatchDateInp"><i class="fas fa-calendar-alt mr-2"></i>Date of Dispatch</label>
                    <input type="date" class="form-control" id="DispatchDateInp">
                </div>
                <div class="form-group col-md-4">
                    <label for="DeliveryDateInp"><i class="fas fa-truck mr-2"></i>Estimated Delivery Date</label>
                    <input type="date" class="form-control" id="DeliveryDateInp">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="CurrentLocationInp"><i class="fas fa-map-pin mr-2"></i>Current Location</label>
                    <input type="text" class="form-control" id="CurrentLocationInp"
                        placeholder="Enter current location">

                </div>
                <div class="form-group col-md-6">
                    <label for="LastUpdateInp"><i class="fas fa-clock mr-2"></i>Last Update</label>
                    <input type="datetime-local" class="form-control" id="LastUpdateInp">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="WeightInp"><i class="fas fa-weight mr-2"></i>Weight (kg)</label>
                    <input type="number" class="form-control" id="WeightInp" placeholder="Enter weight">
                </div>
                <div class="form-group col-md-8">
                    <label for="DimensionsInp"><i class="fas fa-ruler-combined mr-2"></i>Dimensions (LxWxH cm)</label>
                    <input type="text" class="form-control" id="DimensionsInp" placeholder="Length x Width x Height">
                </div>
            </div>
            <div class="form-group text-center mt-4">
                <button type="button" class="btn btn-primary" id="AddBtn"><i class="fas fa-plus mr-2"></i>Add</button>
                <button type="button" class="btn btn-secondary" id="RetBtn"><i
                        class="fas fa-search mr-2"></i>Retrieve</button>
                <button type="button" class="btn btn-success" id="UpdBtn"><i
                        class="fas fa-sync-alt mr-2"></i>Update</button>
                <button type="button" class="btn btn-danger" id="DelBtn"><i
                        class="fas fa-trash-alt mr-2"></i>Delete</button>
            </div>
        </form>
    </div>

    <script type="module">
        // Firebase configuration and initialization code remains the same
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
        import { getDatabase, ref, child, get, set, update, remove } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOOj86UOijPcIzB3AgsiGzmMDun-nditA",
            authDomain: "unique-logistix.firebaseapp.com",
            databaseURL: "https://unique-logistix-default-rtdb.firebaseio.com",
            projectId: "unique-logistix",
            storageBucket: "unique-logistix.appspot.com",
            messagingSenderId: "820421076514",
            appId: "1:820421076514:web:8776f14e9c78ff5db78c7b",
            measurementId: "G-6Q2RY0LM09"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase();

        function getTrackingIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('trackingId');
        }

        const trackingId = getTrackingIdFromURL();

        function updateTrackingInfo() {
            const dbRef = ref(db, 'shipments/' + trackingId);
            get(dbRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById('TrackingIdInp').value = data.trackingId || '';
                    document.getElementById('SourceInp').value = data.source || '';
                    document.getElementById('DestinationInp').value = data.destination || '';
                    document.getElementById('StatusInp').value = data.status || '';
                    document.getElementById('DispatchDateInp').value = data.dispatchDate || '';
                    document.getElementById('DeliveryDateInp').value = data.estimatedDeliveryDate || '';
                    document.getElementById('CurrentLocationInp').value = data.currentLocation || '';
                    document.getElementById('LastUpdateInp').value = data.lastUpdate || '';
                    document.getElementById('WeightInp').value = data.weight || '';
                    document.getElementById('DimensionsInp').value = data.dimensions || '';

                    // Update progress bar based on status
                    const steps = ['stepFrom', 'stepReceived', 'transitDetails', 'stepOutForDelivery', 'stepTo'];
                    const currentStep = steps.indexOf(data.status) + 1;
                    steps.forEach((step, index) => {
                        const element = document.getElementById(step).parentElement;
                        if (index < currentStep) {
                            element.classList.add('active');
                        } else {
                            element.classList.remove('active');
                        }
                    });

                    // Show/hide alert
                    document.getElementById('alertSuccess').style.display = data.alert ? 'block' : 'none';
                } else {
                    console.log('No data available');
                }
            }).catch((error) => {
                console.error('Error fetching data:', error);
            });
        }

        if (trackingId) {
            updateTrackingInfo();
        } else {
            console.error('No tracking ID provided');
        }
    </script>
</body>

</html>
